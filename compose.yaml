services:
  ib_gateway:
    container_name: ib_gateway
    image: docker.io/gnzsnz/ib-gateway:10.34.1a@sha256:d1779edb24f50ca44d4bd20d4098ffd5b2b81ca98cf21e6676ed465befb7dd44
    restart: unless-stopped
    env_file:
      - .env-ibkr-1
    environment:
      TWS_SETTINGS_PATH: /home/ibgateway/Jts
      AUTO_RESTART_TIME: "11:59 PM"
      TWOFA_TIMEOUT_ACTION: restart
    ports:
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"
    volumes:
      - ib-gateway-settings:/home/ibgateway/Jts

  ib_gateway_2:
    container_name: ib_gateway_2
    image: ghcr.io/code-hustler-ft3d/ibg-controller:0.15.0@sha256:a62023992fd1d705a9cb8d23c3fb449204cfc24ef0c3a4e25f7baa51311d7070
    restart: on-failure
    stop_grace_period: 90s
    env_file:
      - .env-ibkr-2
    environment:
      USE_IBG_CONTROLLER: "yes"
      TRADING_MODE: live
      READ_ONLY_API: "yes"
      TWS_SETTINGS_PATH: /home/ibgateway/Jts
      AUTO_RESTART_TIME: "11:59 PM"
      TWOFA_TIMEOUT_ACTION: none
      TIME_ZONE: Etc/UTC
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:9082:8080"
    volumes:
      - ib-gateway-2-settings:/home/ibgateway/Jts

  eyri_app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      - ib_gateway
    env_file:
      - .env
    environment:
      PODMAN_SOCKET_PATH: /run/podman/podman.sock
      EYRI_MCP_HOST: "0.0.0.0"
      EYRI_MCP_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "deno run -A src/healthcheck.ts",
        ]
      interval: 2m
      timeout: 45s
      start_period: 2m
      retries: 1
    security_opt:
      - label=disable
    volumes:
      - eyri-data:/app/data
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:rw

volumes:
  ib-gateway-settings:
  ib-gateway-2-settings:
  eyri-data:
